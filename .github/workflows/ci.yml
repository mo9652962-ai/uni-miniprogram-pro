name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    name: Build & TypeScript Quality Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Build WeChat MiniProgram
        run: npm run build:mp-weixin

      - name: Verify build artifacts
        run: |
          test -d dist/build/mp-weixin
          test -f dist/build/mp-weixin/app.json
          echo "WeChat MiniProgram build artifacts verified successfully."
